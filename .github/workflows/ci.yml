name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server.py
      - name: Start and probe presentation server
        run: |
          SIX_LOTUS_PORT=7776 python server.py &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:7776/ >/dev/null && exit 0
            sleep 0.25
          done
          exit 1
